---
# Install OpenClaw globally as the openclaw user via pnpm
- name: Install OpenClaw via pnpm
  ansible.builtin.shell:
    cmd: pnpm install -g openclaw@{{ openclaw_version }}
    executable: /bin/bash
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    PNPM_HOME: "{{ openclaw_home }}/.local/share/pnpm"
    PATH: "{{ openclaw_home }}/.local/bin:{{ openclaw_home }}/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin"
    HOME: "{{ openclaw_home }}"
  register: openclaw_install
  changed_when: "'Already up to date' not in openclaw_install.stdout"
  notify: Restart openclaw

- name: Verify OpenClaw installation
  ansible.builtin.shell:
    cmd: openclaw --version
    executable: /bin/bash
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    PNPM_HOME: "{{ openclaw_home }}/.local/share/pnpm"
    PATH: "{{ openclaw_home }}/.local/bin:{{ openclaw_home }}/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin"
    HOME: "{{ openclaw_home }}"
  register: openclaw_version_check
  changed_when: false

- name: Display installed OpenClaw version
  ansible.builtin.debug:
    msg: "OpenClaw installed: {{ openclaw_version_check.stdout }}"
