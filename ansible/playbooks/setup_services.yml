---
- name: Services layer setup
  hosts: vps
  become: true

  pre_tasks:
    - name: Assert target architecture is x86_64
      ansible.builtin.assert:
        that:
          - ansible_architecture == 'x86_64'
        fail_msg: >-
          Unsupported architecture '{{ ansible_architecture }}'.
          Checksums (node_exporter) are for x86_64 only.
          Update checksums in group_vars/all/vars.yml before deploying to a different architecture.

  roles:
    - docker
    - nginx
    - tailscale
    - monitoring

  post_tasks:
    - name: Check if audit rules are immutable
      ansible.builtin.command:
        cmd: auditctl -s
      register: services_audit_status
      changed_when: false

    - name: Warn if reboot is required for new audit rules
      ansible.builtin.debug:
        msg: >-
          WARNING: Audit rules are immutable (enabled 2). New service audit
          rules will not take effect until the host is rebooted.
          Please reboot manually when convenient: sudo reboot
      when: "'enabled 2' in services_audit_status.stdout"
