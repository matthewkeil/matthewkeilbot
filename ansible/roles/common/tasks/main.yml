---
# 1. Update and upgrade packages
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Dist-upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required

- name: Warn if reboot is required
  ansible.builtin.debug:
    msg: >-
      WARNING: A reboot is required after package upgrades.
      Please reboot manually when convenient: sudo reboot
  when: common_reboot_required.stat.exists

# 2. Install essential packages
- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# 3. Set timezone
- name: Set system timezone
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ common_timezone }}"
  changed_when: false

# 4. Configure locale
- name: Generate locale
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present

- name: Check current system locale
  ansible.builtin.command:
    cmd: localectl status
  register: common_current_locale
  changed_when: false

- name: Apply system locale
  ansible.builtin.command:
    cmd: localectl set-locale LANG={{ common_locale }}
  when: common_locale not in common_current_locale.stdout
  changed_when: true

# 5. Set hostname
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"

- name: Ensure hostname entry in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ common_hostname }}"
    state: present

# 6. Vim configuration
- name: Deploy global vim configuration
  ansible.builtin.template:
    src: vimrc.j2
    dest: /etc/vim/vimrc.local
    owner: root
    group: root
    mode: "0644"

# 7. Git configuration
- name: Configure git globally
  community.general.git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop:
    - { name: 'init.defaultBranch', value: 'main' }
    - { name: 'pull.rebase', value: 'false' }
    - { name: 'core.editor', value: 'vim' }
    - { name: 'color.ui', value: 'auto' }

# 8. Configure journald
- name: Limit journald disk usage
  community.general.ini_file:
    path: /etc/systemd/journald.conf
    section: Journal
    option: SystemMaxUse
    value: 500M
    no_extra_spaces: true
    mode: "0644"
  notify: Restart journald
