---
- name: Allow SSH on tailscale0 interface
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "Tailscale SSH"

- name: Allow HTTPS on tailscale0 interface
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "Tailscale Serve HTTPS"

- name: Allow all outbound on tailscale0 interface
  community.general.ufw:
    rule: allow
    direction: out
    interface: tailscale0
    comment: "Tailscale outbound"
