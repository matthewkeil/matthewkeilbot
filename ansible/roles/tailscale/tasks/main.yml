---
- name: Install Tailscale
  ansible.builtin.import_tasks: install.yml

- name: Authenticate to tailnet
  ansible.builtin.import_tasks: authenticate.yml

- name: Configure firewall for Tailscale
  ansible.builtin.import_tasks: firewall.yml

- name: Deploy Tailscale audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/tailscale.rules
    content: |
      # Managed by Ansible — tailscale role
      -w /var/lib/tailscale/ -p wa -k tailscale_config
    owner: root
    group: root
    mode: "0640"
  notify: Reload audit rules

- name: Configure Tailscale Serve
  ansible.builtin.include_tasks: serve.yml
  when: tailscale_serve_services | length > 0
