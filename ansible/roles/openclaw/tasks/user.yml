---
- name: Create openclaw system user
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    comment: "OpenClaw Service User"
    system: true
    shell: /bin/bash
    create_home: true
    home: "{{ openclaw_home }}"
    state: present

- name: Add devops user to openclaw group
  ansible.builtin.user:
    name: "{{ devops_user }}"
    groups: "{{ openclaw_user }}"
    append: true

- name: Ensure openclaw home directory has correct ownership
  ansible.builtin.file:
    path: "{{ openclaw_home }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    state: directory
    mode: "0775"

- name: Create OpenClaw directories (structure only, no config files)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openclaw_config_dir }}", mode: "0775" }
    - { path: "{{ openclaw_config_dir }}/sessions", mode: "0775" }
    - { path: "{{ openclaw_config_dir }}/credentials", mode: "0770" }
    - { path: "{{ openclaw_config_dir }}/data", mode: "0775" }
    - { path: "{{ openclaw_config_dir }}/logs", mode: "0775" }
    - { path: "{{ openclaw_config_dir }}/agents", mode: "0775" }
    - { path: "{{ openclaw_config_dir }}/agents/main", mode: "0775" }
    - { path: "{{ openclaw_config_dir }}/agents/main/agent", mode: "0770" }
    - { path: "{{ openclaw_config_dir }}/workspace", mode: "0775" }

# User-local pnpm store (allows service user to install packages without root)
- name: Create pnpm directories for openclaw user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0775"
  loop:
    - "{{ openclaw_home }}/.local/share/pnpm"
    - "{{ openclaw_home }}/.local/share/pnpm/store"
    - "{{ openclaw_home }}/.local/bin"

- name: Configure pnpm global directories for openclaw user
  ansible.builtin.shell:
    cmd: |
      CURRENT_GLOBAL_DIR=$(pnpm config get global-dir 2>/dev/null || echo "")
      CURRENT_BIN_DIR=$(pnpm config get global-bin-dir 2>/dev/null || echo "")
      CHANGED=0
      if [ "$CURRENT_GLOBAL_DIR" != "{{ openclaw_home }}/.local/share/pnpm" ]; then
        pnpm config set global-dir {{ openclaw_home }}/.local/share/pnpm
        CHANGED=1
      fi
      if [ "$CURRENT_BIN_DIR" != "{{ openclaw_home }}/.local/bin" ]; then
        pnpm config set global-bin-dir {{ openclaw_home }}/.local/bin
        CHANGED=1
      fi
      exit $CHANGED
    executable: /bin/bash
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  become: true
  become_user: "{{ openclaw_user }}"
  register: openclaw_pnpm_config
  changed_when: openclaw_pnpm_config.rc == 1
  failed_when: openclaw_pnpm_config.rc > 1

- name: Configure .bashrc for openclaw user
  ansible.builtin.blockinfile:
    path: "{{ openclaw_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - OpenClaw config"
    block: |
      # Enable 256 colors
      export TERM=xterm-256color
      export COLORTERM=truecolor

      # Add pnpm to PATH
      export PNPM_HOME="{{ openclaw_home }}/.local/share/pnpm"
      export PATH="{{ openclaw_home }}/.local/bin:$PNPM_HOME:$PATH"

      # Color support for common tools
      export CLICOLOR=1
      export LS_COLORS='di=34:ln=35:so=32:pi=33:ex=31:bd=34;46:cd=34;43:su=30;41:sg=30;46:tw=30;42:ow=30;43'

      # Aliases
      alias ls='ls --color=auto'
      alias grep='grep --color=auto'
      alias ll='ls -lah'
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0644"

- name: Add openclaw user to sudoers with scoped NOPASSWD
  ansible.builtin.template:
    src: openclaw-sudoers.j2
    dest: "/etc/sudoers.d/{{ openclaw_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# Docker group access (required for container sandbox mode)
- name: Add openclaw user to docker group
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    groups: docker
    append: true

- name: Reset SSH connection to apply docker group
  ansible.builtin.meta: reset_connection

# DBus and systemd user services
- name: Get openclaw user ID
  ansible.builtin.command:
    cmd: "id -u {{ openclaw_user }}"
  register: openclaw_uid
  changed_when: false

- name: Store openclaw UID as fact for later use
  ansible.builtin.set_fact:
    openclaw_uid_value: "{{ openclaw_uid.stdout }}"

- name: Enable lingering for openclaw user (allows systemd user services without login)
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ openclaw_user }}"
  changed_when: false

- name: Create runtime directory for openclaw user
  ansible.builtin.file:
    path: "/run/user/{{ openclaw_uid_value }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0700"

- name: Set XDG_RUNTIME_DIR in .bashrc for openclaw user
  ansible.builtin.lineinfile:
    path: "{{ openclaw_home }}/.bashrc"
    line: 'export XDG_RUNTIME_DIR=/run/user/$(id -u)'
    state: present
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0644"

- name: Set DBUS_SESSION_BUS_ADDRESS in .bashrc for openclaw user
  ansible.builtin.blockinfile:
    path: "{{ openclaw_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DBus config"
    block: |
      # DBus session bus configuration
      if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
        export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
      fi
    create: true
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0644"

- name: Create .bash_profile to source .bashrc for login shells
  ansible.builtin.copy:
    dest: "{{ openclaw_home }}/.bash_profile"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0644"
    content: |
      # .bash_profile - Executed for login shells
      # Source .bashrc to ensure environment is loaded for login shells
      if [ -f ~/.bashrc ]; then
          . ~/.bashrc
      fi

# SSH keypair for outbound connections (GitHub, other hosts)
- name: Create .ssh directory for openclaw user
  ansible.builtin.file:
    path: "{{ openclaw_home }}/.ssh"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_user }}"
    mode: "0700"

- name: Generate SSH keypair for openclaw user
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519
      -f {{ openclaw_home }}/.ssh/id_ed25519
      -N ""
      -C "{{ openclaw_user }}@{{ ansible_hostname }}"
    creates: "{{ openclaw_home }}/.ssh/id_ed25519"
  become: true
  become_user: "{{ openclaw_user }}"

- name: Read openclaw public key
  ansible.builtin.slurp:
    src: "{{ openclaw_home }}/.ssh/id_ed25519.pub"
  register: openclaw_ssh_pubkey

- name: Display openclaw public key (add to GitHub deploy keys)
  ansible.builtin.debug:
    msg: "{{ openclaw_ssh_pubkey.content | b64decode | trim }}"
