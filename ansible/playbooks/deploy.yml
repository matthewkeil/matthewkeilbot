# Deploy matthewkeilbot playbook
# Deploys or updates OpenClaw on the EC2 instance
---
- name: Deploy matthewkeilbot
  hosts: all
  become: true

  vars:
    openclaw_config_dir: "/home/{{ openclaw_user }}/.openclaw"

  tasks:
    - name: Retrieve Telegram bot token from SSM
      ansible.builtin.command:
        cmd: "aws ssm get-parameter --name {{ ssm_telegram_token_path }} --with-decryption --query 'Parameter.Value' --output text --region {{ aws_region }}"
      register: telegram_token_result
      changed_when: false
      become: false
      delegate_to: localhost

    - name: Retrieve Anthropic API key from SSM
      ansible.builtin.command:
        cmd: "aws ssm get-parameter --name {{ ssm_anthropic_key_path }} --with-decryption --query 'Parameter.Value' --output text --region {{ aws_region }}"
      register: anthropic_key_result
      changed_when: false
      become: false
      delegate_to: localhost

    - name: Validate SSM parameters are not placeholders
      ansible.builtin.assert:
        that:
          - telegram_token_result.stdout != 'PLACEHOLDER_SET_VIA_CLI'
          - anthropic_key_result.stdout != 'PLACEHOLDER_SET_VIA_CLI'
        fail_msg: |
          SSM parameters contain placeholder values. Please set them using AWS CLI:
            aws ssm put-parameter --name {{ ssm_telegram_token_path }} --value "YOUR_TELEGRAM_BOT_TOKEN" --type SecureString --overwrite
            aws ssm put-parameter --name {{ ssm_anthropic_key_path }} --value "YOUR_ANTHROPIC_API_KEY" --type SecureString --overwrite

    - name: Set secret facts
      ansible.builtin.set_fact:
        telegram_bot_token: "{{ telegram_token_result.stdout }}"
        anthropic_api_key: "{{ anthropic_key_result.stdout }}"
      no_log: true

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: ../templates/docker-compose.yml.j2
        dest: "{{ openclaw_home }}/docker-compose.yml"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0644"
      notify: Restart matthewkeilbot

    - name: Copy OpenClaw configuration
      ansible.builtin.template:
        src: ../templates/openclaw.json.j2
        dest: "{{ openclaw_config_dir }}/openclaw.json"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0600"
      notify: Restart matthewkeilbot

    - name: Copy environment file
      ansible.builtin.template:
        src: ../templates/env.j2
        dest: "{{ openclaw_home }}/.env"
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0600"
      no_log: true
      notify: Restart matthewkeilbot

    - name: Pull latest OpenClaw Docker image
      community.docker.docker_image:
        name: "ghcr.io/openclaw/openclaw:{{ openclaw_version }}"
        source: pull
        force_source: true
      notify: Restart matthewkeilbot

    - name: Ensure matthewkeilbot is running
      community.docker.docker_compose_v2:
        project_src: "{{ openclaw_home }}"
        state: present
      become_user: "{{ openclaw_user }}"

    - name: Wait for matthewkeilbot to be healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ openclaw_port }}/"
        status_code: [200, 302]
      register: health_check
      until: health_check.status in [200, 302]
      retries: 30
      delay: 5

    - name: Display deployment status
      ansible.builtin.debug:
        msg: |
          matthewkeilbot deployed successfully!
          - Container status: Running
          - Health check: Passed
          - Gateway URL: http://localhost:{{ openclaw_port }}

  handlers:
    - name: Restart matthewkeilbot
      community.docker.docker_compose_v2:
        project_src: "{{ openclaw_home }}"
        state: present
        restarted: true
      become_user: "{{ openclaw_user }}"
