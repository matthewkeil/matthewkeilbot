---
- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ monitoring_node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Check currently installed node_exporter version
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: monitoring_node_exporter_current
  failed_when: false
  changed_when: false

- name: Detect system architecture
  ansible.builtin.set_fact:
    monitoring_node_exporter_arch: >-
      {{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}

- name: Assert node_exporter checksum is provided
  ansible.builtin.assert:
    that:
      - monitoring_node_exporter_checksum | length > 0
    fail_msg: >-
      monitoring_node_exporter_checksum is empty.
      Set it in group_vars/all/vars.yml with the SHA256 checksum for
      node_exporter-{{ monitoring_node_exporter_version }}.linux-{{ monitoring_node_exporter_arch }}.tar.gz
      from https://github.com/prometheus/node_exporter/releases

- name: Install node_exporter binary
  when: >-
    monitoring_node_exporter_current.rc != 0 or
    monitoring_node_exporter_version not in monitoring_node_exporter_current.stderr
  block:
    - name: Download node_exporter tarball
      ansible.builtin.get_url:
        url: >-
          https://github.com/prometheus/node_exporter/releases/download/v{{
          monitoring_node_exporter_version }}/node_exporter-{{
          monitoring_node_exporter_version }}.linux-{{
          monitoring_node_exporter_arch }}.tar.gz
        dest: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.tar.gz"
        checksum: "sha256:{{ monitoring_node_exporter_checksum }}"
        mode: "0644"

    - name: Extract node_exporter tarball
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: >-
          /tmp/node_exporter-{{ monitoring_node_exporter_version }}.linux-{{
          monitoring_node_exporter_arch }}/node_exporter
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

    - name: Clean up node_exporter tarball
      ansible.builtin.file:
        path: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.tar.gz"
        state: absent

    - name: Clean up node_exporter extracted directory
      ansible.builtin.file:
        path: "/tmp/node_exporter-{{ monitoring_node_exporter_version }}.linux-{{ monitoring_node_exporter_arch }}"
        state: absent

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
