---
- name: Application verification tests
  hosts: vps
  become: true
  gather_facts: true

  tasks:
    # ── OpenClaw ────────────────────────────────────────────────────
    - name: "OpenClaw - check openclaw is installed"
      ansible.builtin.command:
        cmd: openclaw --version
      environment:
        N_PREFIX: /usr/local
        PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
      register: test_openclaw_version
      changed_when: false

    - name: "OpenClaw - assert openclaw is available"
      ansible.builtin.assert:
        that:
          - test_openclaw_version.rc == 0
        fail_msg: "openclaw is not installed or not in PATH."

    - name: "OpenClaw - check service state"
      ansible.builtin.systemd:
        name: openclaw@matthewkeilbot
      register: test_openclaw_service

    - name: "OpenClaw - assert service is running"
      ansible.builtin.assert:
        that:
          - test_openclaw_service.status.ActiveState == 'active'
        fail_msg: "openclaw@matthewkeilbot is not active."

    - name: "OpenClaw - assert service is enabled"
      ansible.builtin.assert:
        that:
          - test_openclaw_service.status.UnitFileState == 'enabled'
        fail_msg: "openclaw@matthewkeilbot is not enabled."

    - name: "OpenClaw - check config file"
      ansible.builtin.stat:
        path: /home/matthewkeilbot/.openclaw/config.json5
      register: test_openclaw_config

    - name: "OpenClaw - assert config file is correct"
      ansible.builtin.assert:
        that:
          - test_openclaw_config.stat.exists
          - test_openclaw_config.stat.mode == '0600'
          - test_openclaw_config.stat.pw_name == 'matthewkeilbot'
        fail_msg: >-
          config.json5 does not exist or has wrong
          permissions/ownership.

    - name: "OpenClaw - check env file"
      ansible.builtin.stat:
        path: /home/matthewkeilbot/.openclaw/env
      register: test_openclaw_env

    - name: "OpenClaw - assert env file is correct"
      ansible.builtin.assert:
        that:
          - test_openclaw_env.stat.exists
          - test_openclaw_env.stat.mode == '0600'
        fail_msg: "env file does not exist or has wrong permissions."

    - name: "OpenClaw - check gateway token file"
      ansible.builtin.stat:
        path: /home/matthewkeilbot/.openclaw/gateway-token
      register: test_openclaw_token

    - name: "OpenClaw - assert gateway token file is correct"
      ansible.builtin.assert:
        that:
          - test_openclaw_token.stat.exists
          - test_openclaw_token.stat.mode == '0600'
        fail_msg: "gateway-token does not exist or has wrong permissions."

    - name: "OpenClaw - check HTTP endpoint"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ openclaw_port }}/"
        status_code:
          - 200
          - 302
      register: test_openclaw_http

    - name: "OpenClaw - check listening ports"
      ansible.builtin.command:
        cmd: ss -tlnp
      register: test_openclaw_ss
      changed_when: false

    - name: "OpenClaw - assert listening on localhost"
      ansible.builtin.assert:
        that:
          - "'127.0.0.1' in test_openclaw_ss.stdout"
        fail_msg: >-
          OpenClaw does not appear to be bound to
          127.0.0.1 on port {{ openclaw_port }}.

    - name: "OpenClaw - assert NoNewPrivileges is enabled"
      ansible.builtin.assert:
        that:
          - test_openclaw_service.status.NoNewPrivileges == 'yes'
        fail_msg: >-
          NoNewPrivileges is not set for
          openclaw@matthewkeilbot.

    - name: "OpenClaw - get UFW status"
      ansible.builtin.command:
        cmd: ufw status
      changed_when: false
      register: test_ufw_app

    - name: "OpenClaw - assert UFW port on tailscale0"
      ansible.builtin.assert:
        that:
          - >-
            test_ufw_app.stdout_lines
            | select('search', openclaw_port | string)
            | select('search', 'on tailscale0')
            | select('search', 'ALLOW')
            | list
            | length > 0
        fail_msg: >-
          OpenClaw port {{ openclaw_port }} is not allowed
          on tailscale0.

    - name: "OpenClaw - assert audit rules are loaded"
      ansible.builtin.command:
        cmd: auditctl -l
      register: test_openclaw_audit
      changed_when: false

    - name: "OpenClaw - assert openclaw_secrets audit rule"
      ansible.builtin.assert:
        that:
          - "'openclaw_secrets' in test_openclaw_audit.stdout"
        fail_msg: "OpenClaw audit rules are not loaded."

    # ── OpenClaw user verification ─────────────────────────────────
    - name: "OpenClaw user - check passwd entry"
      ansible.builtin.command:
        cmd: "getent passwd {{ openclaw_user }}"
      changed_when: false
      register: test_openclaw_passwd

    - name: "OpenClaw user - assert bash shell"
      ansible.builtin.assert:
        that:
          - "'/bin/bash' in test_openclaw_passwd.stdout"
        fail_msg: "OpenClaw user does not have /bin/bash shell."

    - name: "OpenClaw user - check home directory"
      ansible.builtin.stat:
        path: "{{ openclaw_home }}"
      register: test_openclaw_homedir

    - name: "OpenClaw user - assert home directory permissions"
      ansible.builtin.assert:
        that:
          - test_openclaw_homedir.stat.mode == '0755'
          - test_openclaw_homedir.stat.pw_name == openclaw_user
        fail_msg: "OpenClaw home directory has wrong permissions or ownership."

    - name: "OpenClaw user - check sudoers file"
      ansible.builtin.stat:
        path: "/etc/sudoers.d/{{ openclaw_user }}"
      register: test_openclaw_sudoers

    - name: "OpenClaw user - assert scoped sudoers exists"
      ansible.builtin.assert:
        that:
          - test_openclaw_sudoers.stat.exists
          - test_openclaw_sudoers.stat.mode == '0440'
        fail_msg: "OpenClaw scoped sudoers file missing or wrong permissions."

    - name: "OpenClaw user - check .ssh directory"
      ansible.builtin.stat:
        path: "{{ openclaw_home }}/.ssh"
      register: test_openclaw_ssh

    - name: "OpenClaw user - assert .ssh directory exists"
      ansible.builtin.assert:
        that:
          - test_openclaw_ssh.stat.exists
          - test_openclaw_ssh.stat.mode == '0700'
        fail_msg: "OpenClaw .ssh directory missing or wrong permissions."

    - name: "OpenClaw user - check .bashrc exists"
      ansible.builtin.stat:
        path: "{{ openclaw_home }}/.bashrc"
      register: test_openclaw_bashrc

    - name: "OpenClaw user - assert .bashrc exists"
      ansible.builtin.assert:
        that:
          - test_openclaw_bashrc.stat.exists
        fail_msg: "OpenClaw .bashrc is missing."

    - name: "OpenClaw user - assert not in docker group"
      ansible.builtin.command:
        cmd: getent group docker
      changed_when: false
      failed_when: false
      register: test_openclaw_docker_group

    - name: "OpenClaw user - assert excluded from docker group"
      ansible.builtin.assert:
        that:
          - "openclaw_user not in test_openclaw_docker_group.stdout"
        fail_msg: "OpenClaw user is in the docker group — root-equivalent access."

    # ── Summary ─────────────────────────────────────────────────────
    - name: All application tests passed
      ansible.builtin.debug:
        msg: "All application assertions passed."
