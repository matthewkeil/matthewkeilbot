---
# Connection
ansible_host: "{{ vault_ansible_host }}"
ansible_user: "devops"
ansible_port: "{{ ssh_port }}"

# System
system_timezone: "UTC"
system_locale: "en_US.UTF-8"
system_hostname: "matthewkeilhost"

# SSH (vault_ssh_port is used by the bootstrap role and security role to configure sshd, not for Ansible connections)
ssh_port: "{{ vault_ssh_port }}"

# Users
devops_user: "devops"
devops_ssh_public_key: "{{ vault_devops_ssh_public_key }}"

# Service users
service_users:
  - name: "matthewkeilbot"
    home: "/home/matthewkeilbot"

# Tailscale
# tailscale_auth_key: passed via CLI (-e tailscale_auth_key=...) for first-time setup only

# OpenClaw
openclaw_version: "v2026.3.1"
openclaw_port: "{{ vault_openclaw_port }}"
openclaw_bot_name: "matthewkeilbot"
openclaw_user: "matthewkeilbot"
openclaw_home: "/home/matthewkeilbot"
openclaw_sandbox_mode: "container"
openclaw_gateway_bind: "loopback"

# Toolchain versions
node_version: 24
n_version: "v10.2.0"
python3_version: "3.12.8"
pyenv_version: "v2.4.22"
zig_version: "0.14.1"

# Checksums (required — roles will fail if empty; get from GitHub releases)
monitoring_node_exporter_checksum: "a550cd5c05f760b7934a2d0afad66d2e92e681482f5f57a917465b1fba3b02a6" # SHA256 for node_exporter-1.7.0.linux-amd64.tar.gz
node_n_checksum: "5914f0d5e89aadaaaeb803baa89a7582747b0c57ad30201b3522cd76f504c7d9" # SHA256 for n-10.2.0.tar.gz from GitHub archive
zig_checksum: "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c" # SHA256 for zig-x86_64-linux-0.14.1.tar.xz
rust_rustup_checksum: "6aeece6993e902708983b209d04c0d1dbb14ebb405ddb87def578d41f920f56d" # SHA256 for rustup-init 1.27.1 x86_64-unknown-linux-gnu
python_pyenv_commit_sha: "d04a081dcb18863ca6179070d7b7afe73559581b" # Git commit SHA for pyenv v2.4.22

# Monitoring
monitoring_alert_method: "log"
node_exporter_version: "1.7.0"
monitoring_watched_services:
  - "openclaw@matthewkeilbot"
