---
- name: Install auditd packages
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: Configure auditd max_log_file
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^max_log_file\s*='
    line: "max_log_file = {{ security_auditd_max_log_file }}"
  notify: Restart auditd

- name: Configure auditd num_logs
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^num_logs\s*='
    line: "num_logs = {{ security_auditd_num_logs }}"
  notify: Restart auditd

- name: Configure auditd max_log_file_action
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^max_log_file_action\s*='
    line: "max_log_file_action = {{ security_auditd_max_log_file_action }}"
  notify: Restart auditd

- name: Deploy audit rules
  ansible.builtin.template:
    src: audit-rules.j2
    dest: /etc/audit/rules.d/hardening.rules
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd
