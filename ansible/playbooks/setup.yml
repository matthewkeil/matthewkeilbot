# Initial server setup playbook
# Run this once after CDK deployment to verify server is ready
---
- name: Setup OpenClaw Server
  hosts: all
  become: true

  tasks:
    - name: Wait for cloud-init to complete
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_result
      changed_when: false
      failed_when: cloud_init_result.rc != 0

    - name: Check if bootstrap completed
      ansible.builtin.stat:
        path: /opt/openclaw/bootstrap-complete
      register: bootstrap_file

    - name: Verify Docker is installed
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "Docker version: {{ docker_version.stdout }}"

    - name: Verify Docker Compose is installed
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "Docker Compose version: {{ compose_version.stdout }}"

    - name: Verify AWS CLI is installed
      ansible.builtin.command: aws --version
      register: aws_version
      changed_when: false

    - name: Display AWS CLI version
      ansible.builtin.debug:
        msg: "AWS CLI version: {{ aws_version.stdout }}"

    - name: Ensure openclaw directory exists
      ansible.builtin.file:
        path: "{{ openclaw_home }}"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0755"

    - name: Ensure .openclaw config directory exists
      ansible.builtin.file:
        path: "/home/{{ openclaw_user }}/.openclaw"
        state: directory
        owner: "{{ openclaw_user }}"
        group: "{{ openclaw_user }}"
        mode: "0700"

    - name: Display setup complete message
      ansible.builtin.debug:
        msg: |
          Server setup verification complete!
          - Bootstrap: {{ 'Complete' if bootstrap_file.stat.exists else 'Not found' }}
          - Docker: Installed
          - Docker Compose: Installed
          - AWS CLI: Installed

          Next steps:
          1. Set SSM parameters with actual values
          2. Run the deploy playbook: ansible-playbook playbooks/deploy.yml
