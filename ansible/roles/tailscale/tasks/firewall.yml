---
- name: Allow SSH on tailscale0 interface
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "Tailscale SSH"

- name: Allow node_exporter on tailscale0 interface
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "Tailscale node_exporter"

- name: Allow HTTPS on tailscale0 interface
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "Tailscale Serve HTTPS"

- name: Allow OpenClaw port on tailscale0 interface
  community.general.ufw:
    rule: allow
    port: "{{ openclaw_port }}"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "Tailscale OpenClaw"

- name: Allow all outbound on tailscale0 interface
  community.general.ufw:
    rule: allow
    direction: out
    interface: tailscale0
    comment: "Tailscale outbound"
