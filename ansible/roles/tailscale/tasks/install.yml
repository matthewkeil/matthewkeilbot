---
- name: Check if Tailscale is already installed
  ansible.builtin.command:
    cmd: tailscale version
  register: tailscale_installed
  failed_when: false
  changed_when: false

- name: Install Tailscale from apt repository
  when: tailscale_installed.rc != 0
  block:
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /etc/apt/keyrings/tailscale.gpg
        mode: "0644"

    - name: Add Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/tailscale.gpg]
          https://pkgs.tailscale.com/stable/ubuntu
          {{ ansible_distribution_release }} main
        filename: tailscale
        state: present

- name: Install Tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Get installed Tailscale version
  ansible.builtin.command:
    cmd: tailscale version
  register: tailscale_version_output
  changed_when: false

- name: Verify Tailscale meets minimum version requirement
  ansible.builtin.assert:
    that:
      - >-
        tailscale_version_output.stdout_lines[0]
        | regex_replace('[^0-9.]', '')
        is version(tailscale_minimum_version, '>=')
    fail_msg: >-
      Tailscale version {{ tailscale_version_output.stdout_lines[0] }}
      is below minimum required {{ tailscale_minimum_version }}.
      Versions below 1.54 are affected by TS-2024-001.
      Update Tailscale before proceeding.

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
